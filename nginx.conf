server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Single self-contained landing page: no directory listing, no stray files.
    autoindex off;

    location = /index.html {
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Serving only static bytes; no upstream involved.
    error_page 404 /index.html;
}
