name: Deploy site to GitHub Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            2024-src/package-lock.json
            2025-src/package-lock.json

      - name: Build 2024 site
        working-directory: 2024-src
        run: |
          npm ci || npm i
          npm run build -- --base=/2024/

      - name: Build 2025 site
        working-directory: 2025-src
        run: |
          npm ci || npm i
          npm run build -- --base=/2025/

      - name: Assemble site
        run: |
          mkdir -p _site
          # Root serves the 2026 landing; /2026 is the same copy
          cp -r 2026/. _site/
          cp -r 2026 _site/2026
          cp -r 2018 _site/2018
          cp -r 2024-src/src/dist _site/2024
          cp -r 2025-src/dist _site/2025

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
