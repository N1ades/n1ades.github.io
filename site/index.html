<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>nyades</title>
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;background:#000;color:#eee;font:500 14px system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:hidden}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
h1{position:fixed;top:calc(18px + env(safe-area-inset-top,0px));left:0;right:0;margin:0;text-align:center;font:600 12px system-ui,sans-serif;letter-spacing:.6em;text-indent:.6em;color:#888;opacity:0;transition:opacity 2s;z-index:3;pointer-events:none}
body.go h1{opacity:1}
#st{position:relative;width:100%;transition:transform .4s ease-out}
.w{position:absolute;left:0;top:0;width:0;height:0;opacity:0;transition:transform 1.5s cubic-bezier(.2,1.1,.3,1),opacity .7s;pointer-events:none}
.cl{position:absolute;left:0;top:0;width:400px;height:290px;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(closest-side,var(--c),transparent);opacity:.09;filter:blur(18px)}
.t{position:absolute;left:0;top:0;transform:translate(-50%,-50%);font-size:11px;letter-spacing:.3em;text-indent:.3em;text-transform:uppercase;color:var(--c);opacity:.8;white-space:nowrap}
.k{position:absolute;left:0;top:0;transform:translate(-50%,-50%);width:88px;display:flex;flex-direction:column;align-items:center;gap:8px;color:#ccc;text-decoration:none;font-size:12px;letter-spacing:.04em;animation:f 5s ease-in-out infinite;transition:color .2s,filter .2s}
.k svg{width:50px;height:50px;color:var(--i);transition:transform .2s}
@keyframes f{50%{translate:0 -6px}}
.live .k{pointer-events:auto}
.k:hover{color:#fff;filter:drop-shadow(0 0 12px var(--i))}
.k:hover svg,.k:hover img:not(.bd){transform:scale(1.15)}
.k img{width:50px;height:50px;object-fit:contain;border-radius:22%;transition:transform .2s}
.k img.bd{position:absolute;left:50px;top:28px;width:30px;height:30px;border-radius:8px;border:2px solid #000;margin:0;background:#000}
.k span{text-align:center;line-height:1.2}
#fb img{width:48px;height:48px;border-radius:22%}
#pv{position:fixed;width:320px;z-index:9;opacity:0;transition:opacity .2s;pointer-events:none;border:1px solid #333;border-radius:12px;overflow:hidden;background:#0a0a0a;box-shadow:0 10px 40px #000}
#pv.on{opacity:1}
#ph{height:24px;padding:5px 10px;font-size:11px;color:#888;background:#111;white-space:nowrap;overflow:hidden}
#pb{position:relative;height:200px}
#fb{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#aaa}
#fb svg{width:48px;height:48px}
#pb iframe{position:absolute;left:0;top:0;width:1100px;height:690px;transform:scale(.2909);transform-origin:0 0;border:0;background:#fff;display:none}
</style></head><body>
<canvas id="cv"></canvas><canvas id="fx"></canvas>
<h1>NYADES</h1>
<div id="st"></div>
<div id="pv"><div id="ph"></div><div id="pb"><div id="fb"></div></div></div>

const FS=`precision highp float;

 vec2 q=vec2(pd.x,pd.y/(.17+.07*M.y));
 float rq=length(q)+1e-4;

 vec2 wh=wv(r,a),wd=wv(rq,aq);
 float e=(hl*(1.+2.*wh.x)+dk*(1.+2.5*wd.x))*(1.+P*1.2)*(1.+ml*.6*smoothstep(0.,.25,u)*exp(-v*v*6.));
 vec3 hcol=mix(vec3(1.,.3,.05),vec3(1.,.88,.65),clamp(e*.8,0.,1.));
 col+=hcol*e*1.25+vec3(1.)*ring*(1.1+.9*wh.y+P*.8);

 pox+=((mx>-1e4?(mx/W-.5)*2:0)+Math.sin(t*.13)*.4-pox)*.03;poy+=((mx>-1e4?-((my-scrollY)/H-.5)*2:0)+Math.cos(t*.11)*.3-poy)*.03;

  const e=p.u*p.u*.6+p.u*.4,a=p.sw*6*e*e,co=Math.cos(a),si=Math.sin(a),rx=(p.x0-hX)*(1-e),ry=(p.y0-hY)*(1-e);
